[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-mcp"
version = "0.8.1"
description = "MCP server for the Hack Forums API v2: read forums, draft MyCode, and post with explicit confirmation."
authors = [{ name = "Corta Labs" }]
keywords = ["hackforums", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "anyio>=4.9", "jsonschema>=4.20.0", "mcp>=2.3.0,<3"]

[project.urls]
Homepage = "https://github.com/CortaLabs/hf_mcp"
Repository = "https://github.com/CortaLabs/hf_mcp"
Issues = "https://github.com/CortaLabs/hf_mcp/issues"
Changelog = "https://github.com/CortaLabs/hf_mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build==1.4.0",
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "packaging==26.3",
  "pytest==9.2.0",
  "pytest-randomly==4.1.0",
  "pytest-socket==0.8.0",
  "pytest-xdist==3.8.0",
  "referencing==0.37.0",
  "ruff==0.15.22",
  "setuptools==84.2.1",
  "twine==7.0.0",
  "wheel==0.48.0",
]

[project.scripts]
hf-mcp = "hf_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_mcp = ["data/*.json"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["hf_mcp"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
pythonpath = ["src"]
strict_markers = true
markers = [
  "core: fast hermetic default-lane tests",
  "regression: permanent behavior regression tests",
  "formatting: formatting and local draft tool tests",
  "registry: canonical tool registry and metadata tests",
  "build: package build and release-distribution tests",
]

[tool.mypy]
files = ["src/hf_mcp"]
python_version = "3.11"

[[tool.mypy.overrides]]
# PyYAML and jsonschema ship no inline types; their stub packages are not
# dependencies of this project.
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
