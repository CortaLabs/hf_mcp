[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-mcp"
version = "0.4.4"
description = "Standalone Hack Forums MCP launch surface"
keywords = ["hackforums", "mcp", "model-context-protocol"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "mcp>=2.3.0,<3"]

[project.optional-dependencies]
dev = [
  "build==1.4.0",
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "packaging==26.3",
  "pytest==9.2.0",
  "pytest-randomly==4.1.0",
  "pytest-socket==0.8.0",
  "pytest-xdist==3.8.0",
  "ruff==0.15.22",
  "setuptools==84.2.1",
  "twine==7.0.0",
  "wheel==0.48.0",
]

[project.scripts]
hf-mcp = "hf_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_mcp = ["data/*.json"]

[tool.setuptools.data-files]
"docs" = ["docs/*.md"]
"skills/hf-api-v2" = ["skills/hf-api-v2/SKILL.md"]
"skills/hf-mcp" = ["skills/hf-mcp/SKILL.md"]
"skills/hf-mcp-bootstrap" = ["skills/hf-mcp-bootstrap/SKILL.md"]
"skills/hf-mcp-reads" = ["skills/hf-mcp-reads/SKILL.md"]
"skills/hf-mcp-writes" = ["skills/hf-mcp-writes/SKILL.md"]
"skills/hf-mycode" = ["skills/hf-mycode/SKILL.md"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["hf_mcp"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
strict_markers = true
markers = [
  "core: fast hermetic default-lane tests",
  "regression: permanent behavior regression tests",
  "formatting: formatting and local draft tool tests",
  "registry: canonical tool registry and metadata tests",
  "build: package build and export-boundary tests",
]
