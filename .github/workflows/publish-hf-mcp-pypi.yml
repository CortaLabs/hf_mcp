name: Publish hf-mcp to PyPI

'on':
  release:
    types: [published]

jobs:
  build:
    name: Test and build hf-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the exact commit the release tag points at, so a branch
      # sharing the tag's name cannot be built instead.
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The release build runs without isolation, so the pinned build backend
      # and test tooling come from the project's dev extra.
      - name: Install pinned build and test tooling
        run: python -m pip install ".[dev]"

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Ensure tag matches version and version is not already on PyPI
        run: python scripts/check_pypi_version_available.py --tag "$GITHUB_REF_NAME"

      - name: Build release distributions
        env:
          OUT_DIR: ${{ runner.temp }}/hf-mcp-dist
        run: |
          mkdir -p "$OUT_DIR"
          bash scripts/build_release_dists.sh "$OUT_DIR"

      - name: Check distribution metadata
        env:
          OUT_DIR: ${{ runner.temp }}/hf-mcp-dist
        run: python -m twine check "$OUT_DIR"/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hf-mcp-dist
          path: ${{ runner.temp }}/hf-mcp-dist/*
          if-no-files-found: error

  publish:
    name: Publish hf-mcp
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hf-mcp-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
