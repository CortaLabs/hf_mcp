name: CI

'on':
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tooling
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  build:
    name: Build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned build tooling
        run: python -m pip install ".[dev]"
      - name: Build release distributions
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          bash scripts/build_release_dists.sh "$RUNNER_TEMP/dist"
      - name: Check distribution metadata
        run: twine check "$RUNNER_TEMP"/dist/*
